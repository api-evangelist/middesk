        created_at:
          type: string
          description: Creation timestamp
        matched:
          type: string
          nullable: true
          description: Match status
        executed:
          type: boolean
          description: Execution status
        name:
          type: string
          nullable: true
          description: Policy name
        details:
          type: object
          additionalProperties:
            description: Any type
