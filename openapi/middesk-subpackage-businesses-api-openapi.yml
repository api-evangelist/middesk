      required:
      - full_address
      title: SubmittedAddressFull
    type_:Profile:
      type: object
      properties:
        object:
          type: string
        id:
          type: string
          format: uuid
        type:
          $ref: '#/components/schemas/type_:ProfileType'
        external_id:
          type: string
          nullable: true
        url:
          type: string
          format: uri
        metadata:
          $ref: '#/components/schemas/type_:ProfileMetadata'
        rating:
          type: number
          nullable: true
          format: double
        rating_count:
          type: integer
          nullable: true
      required:
      - object
      - id
      - type
      - url
      title: Profile
    type_:LienSecuredPartiesItemAddressesItem:
      type: object
      properties:
        full_address:
          type: string
        address_line1:
          type: string
        address_line2:
          type: string
          nullable: true
        city:
          type: string
        state:
          type: string
        postal_code:
          type: string
      title: LienSecuredPartiesItemAddressesItem
    type_:ErrorResponseErrorsItem:
