            additionalProperties:
              description: Any type
        registered_agent:
          type: object
          additionalProperties:
            description: Any type
        registration_date:
          type: string
          format: date
        state:
          $ref: '#/components/schemas/type_:RegistrationState'
        source:
          type: string
          format: uri
      required:
      - object
      - id
      - business_id
      - name
      - status
      - jurisdiction
      - entity_type
      - file_number
      - state
      title: Registration
    type_:AddressState:
      type: string
      enum:
      - AL
