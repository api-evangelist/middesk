          format: uuid
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        completed_at:
          type: string
          nullable: true
          format: date-time
        tasks:
          type: array
          items:
            $ref: '#/components/schemas/type_:ReviewTask'
        assignee:
