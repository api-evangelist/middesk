        owner_id:
          type: string
          description: Owner ID
        owner_type:
          type: string
          description: Owner type
        business_id:
          type: string
          description: Business ID
        type_of:
          type: string
          description: Type of policy result
        policy_action_results:
          type: array
          items:
            $ref: '#/components/schemas/type_:PolicyActionResult'
      title: PolicyResult
    type_:LienCollateralType:
      type: string
      enum:
      - Blanket
      - Collateral
      - Unknown
      - All Assets and Receivables
      - All Receivables
      - All Assets
      - Named Assets
      - Unavailable
      title: LienCollateralType
    type_:Monitor:
      type: object
      properties:
        object:
          type: string
        id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
