      - WY
      title: AddressState
    type_:AddressIndicator:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/type_:AddressIndicatorType'
        name:
          $ref: '#/components/schemas/type_:AddressIndicatorName'
        rating:
          $ref: '#/components/schemas/type_:AddressIndicatorRating'
        value:
          type: string
        description:
          type: string
      required:
      - type
      - name
