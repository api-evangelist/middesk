          nullable: true
        city:
          type: string
          nullable: true
        county:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        dispositions:
          type: array
          items:
            $ref: '#/components/schemas/type_:CriminalHistoryChargeDispositionsItem'
        legal_code:
