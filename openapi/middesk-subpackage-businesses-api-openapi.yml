openapi: 3.2.0
info:
  title: Middesk Subpackage Businesses API
  version: 1.0.0
servers:
- url: https://api.middesk.com
  description: Default
tags:
- name: subpackage_businesses
paths:
  /v1/businesses:
    get:
      operationId: list-businesses
      summary: List businesses
      tags:
      - subpackage_businesses
      parameters:
      - name: Authorization
        in: header
        description: Bearer authentication
        required: true
        schema:
          type: string
      responses:
        '200':
          description: businesses list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/type_businesses_ListBusinessesResponse'
    post:
      operationId: create-business
      summary: Create a business
      tags:
      - subpackage_businesses
      parameters:
      - name: Authorization
        in: header
        description: Bearer authentication
        required: true
        schema:
          type: string
      responses:
        '201':
          description: business created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/type__Business'
        '422':
          description: invalid request
          content:
            application/json:
              schema:
                description: Any type
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                tin:
                  $ref: '#/components/schemas/type_businesses_BusinessRequestParamTin'
                addresses:
                  type: array
                  items:
                    $ref: '#/components/schemas/type_businesses_BusinessRequestParamAddressesItem'
                website:
                  $ref: '#/components/schemas/type_businesses_BusinessRequestParamWebsite'
                  description: Website information for the business. Required when name and addresses are not provided when ordering the web_analysis and/or industry_classification subproducts.
                people:
                  type: array
                  items:
                    $ref: '#/components/schemas/type__SubmittedPerson'
                external_id:
                  type: string
                unique_external_id:
                  type: string
                tags:
                  type: array
                  items:
                    type: string
                connection_id:
                  type: string
                  description: The ID of a connection to use as the source for this business. Pre-fills the business name and address from the connection.
                orders:
                  type: array
                  items:
                    $ref: '#/components/schemas/type_businesses_BusinessRequestParamOrdersItem'
                  description: Orders to place against the business at creation time. Each order specifies a product (and optional subproducts/options) to run.
              required:
              - name
              - addresses
  /v1/businesses/{id}:
    get:
      operationId: get-business
      summary: Retrieve a business
      tags:
      - subpackage_businesses
      parameters:
      - name: id
        in: path
        description: Business ID
        required: true
        schema:
          type: string
      - name: Authorization
        in: header
        description: Bearer authentication
        required: true
        schema:
          type: string
      responses:
        '200':
          description: business found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/type__Business'
        '404':
          description: business not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/type__ErrorResponse'
    patch:
      operationId: update-business
      summary: Update a business
      tags:
      - subpackage_businesses
      parameters:
      - name: id
        in: path
        description: Business ID
        required: true
        schema:
          type: string
      - name: Authorization
        in: header
        description: Bearer authentication
        required: true
        schema:
          type: string
      responses:
        '200':
          description: business updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/type__Business'
        '404':
          description: business not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/type__ErrorResponse'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                status:
                  $ref: '#/components/schemas/type_businesses_BusinessUpdateParamStatus'
                  description: Status to set for the business (only final statuses allowed)
                tin:
                  $ref: '#/components/schemas/type_businesses_BusinessUpdateParamTin'
                addresses:
                  type: array
                  items:
                    $ref: '#/components/schemas/type_businesses_BusinessUpdateParamAddressesItem'
                people:
                  type: array
                  items:
                    $ref: '#/components/schemas/type__SubmittedPerson'
                external_id:
                  type: string
                unique_external_id:
                  type: string
                tags:
                  type: array
                  items:
                    type: string
  /v1/businesses/{id}/pdf:
    get:
      operationId: get-business-pdf
      summary: Retrieve a business PDF
      tags:
      - subpackage_businesses
      parameters:
      - name: id
        in: path
        description: Business ID
        required: true
        schema:
          type: string
      - name: Authorization
        in: header
        description: Bearer authentication
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successful response
        '404':
          description: business not found
          content:
            application/json:
              schema:
                description: Any type
components:
  schemas:
    type__Signal:
      type: object
      properties:
        object:
          type: string
        id:
          type: string
          format: uuid
        name:
          type: string
        tin:
          type:
          - string
          - 'null'
        external_id:
          type:
          - string
          - 'null'
        model_slug:
          type: string
        score:
          type:
          - number
          - 'null'
          format: double
        business_id:
          type:
          - string
          - 'null'
          format: uuid
        batch_id:
          type:
          - string
          - 'null'
          format: uuid
        requester:
          $ref: '#/components/schemas/type__SignalRequester'
        reasons:
          type: array
          items:
            $ref: '#/components/schemas/type__SignalReasonsItem'
        addresses:
          type: array
          items:
            type: string
        people:
          type: array
          items:
            type: string
        created_at:
          type: string
          format: date-time
      required:
      - object
      - id
      - name
      - created_at
      title: Signal
    type__SignalReasonsItem:
      type: object
      properties:
        category:
          $ref: '#/components/schemas/type__SignalReasonsItemCategory'
        group:
          type: string
        description:
          type: string
        code:
          $ref: '#/components/schemas/type__SignalReasonsItemCode'
        importance:
          type: number
          format: double
      required:
      - category
      - group
      - description
      - code
      title: SignalReasonsItem
    type__WebsitePhoneNumber:
      type: object
      properties:
        object:
          $ref: '#/components/schemas/type__WebsitePhoneNumberObject'
        id:
          type: string
          format: uuid
        number:
          type: string
        contact_type:
          type:
          - string
          - 'null'
        recommended:
          type:
          - boolean
          - 'null'
        submitted:
          type: boolean
        sources:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/type__Source'
      title: WebsitePhoneNumber
    type__BusinessSubscriptionAvailabilityBankruptcy:
      type: string
      enum:
      - subscribable
      - account_unsubscribable
      title: BusinessSubscriptionAvailabilityBankruptcy
    type__PoliticallyExposedPersonScreeningSettingsMatchScore:
      type: string
      enum:
      - LOW
      - MEDIUM
      - HIGH
      title: PoliticallyExposedPersonScreeningSettingsMatchScore
    type__MonitorEventTypesItem:
      type: object
      properties:
        type:
          type: string
        enabled_at:
          type:
          - string
          - 'null'
          format: date-time
        status:
          $ref: '#/components/schemas/type__MonitorEventTypesItemStatus'
      title: MonitorEventTypesItem
    type__LitigationCaseStatus:
      type: string
      enum:
      - OPEN
      - CLOSED
      - UNKNOWN
      title: LitigationCaseStatus
    type__EmailAddressAddressType:
      type: string
      enum:
      - disposable
      - free
      - private
      description: Classification of the email address. Included when email risk data is present.
      title: EmailAddressAddressType
    type__Website:
      type: object
      properties:
        object:
          $ref: '#/components/schemas/type__WebsiteObject'
        id:
          type: string
          format: uuid
        url:
          type:
          - string
          - 'null'
          format: uri
          description: The URL that was passed or found for the Business
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        status:
          $ref: '#/components/schemas/type__WebsiteStatus'
        http_status_code:
          type:
          - integer
          - 'null'
          description: HTTP response status code
        title:
          type:
          - string
          - 'null'
          description: Website page title
        description:
          type:
          - string
          - 'null'
          description: Website meta description
        domain:
          oneOf:
          - $ref: '#/components/schemas/type__WebsiteDomain'
          - type: 'null'
          description: Domain registration and redirect information
        pages:
          type: array
          items:
            $ref: '#/components/schemas/type__WebsitePagesItem'
          description: Website pages with screenshots
        parked:
          type:
          - boolean
          - 'null'
          description: Whether the domain is parked
        submitted:
          type: boolean
          description: Whether the website was submitted by user
        error:
          type:
          - string
          - 'null'
          description: Error message if website analysis failed
        category:
          type:
          - string
          - 'null'
          description: Website category classification
        platform:
          type:
          - string
          - 'null'
          description: Website platform (e.g., instagram.com, facebook.com)
        posts_summary:
          type:
          - string
          - 'null'
          description: Summary of posts found on the website or linked social media profiles
        reviews_summary:
          type:
          - string
          - 'null'
          description: Summary of reviews found on the website or linked third-party profiles
        business_id:
          type: string
          format: uuid
        business_name_match:
          type: boolean
          description: Whether website content matches business name
        names:
          type: array
          items:
            $ref: '#/components/schemas/type__Name'
          description: Names found on website
        phone_numbers:
          type: array
          items:
            $ref: '#/components/schemas/type__WebsitePhoneNumber'
          description: Phone numbers found on website
        people:
          type:
          - array
          - 'null'
          items:
            type: object
            additionalProperties:
              description: Any type
          description: People found on website
        addresses:
          type: array
          items:
            $ref: '#/components/schemas/type__WebsiteAddressesItem'
          description: Addresses found on website
        email_addresses:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/type__WebsiteEmailAddressesItem'
          description: Email addresses found on website
        rating:
          oneOf:
          - $ref: '#/components/schemas/type__WebsiteRating'
          - type: 'null'
      required:
      - object
      - id
      - url
      - created_at
      - updated_at
      - status
      - parked
      - submitted
      - business_id
      - business_name_match
      - phone_numbers
      - addresses
      title: Website
    type__AddressIndicatorType:
      type: string
      enum:
      - valid_us_address
      - deliverability
      - geographical_location
      - registered_agent
      - private_mailbox
      - location_frequency
      - property_type
      - virtual_address
      title: AddressIndicatorType
    type_businesses_BusinessUpdateParamTin:
      type: object
      properties:
        tin:
          type: string
      title: BusinessUpdateParamTin
    type__CriminalHistoryChargeSentencesItem:
      type: object
      properties:
        details:
          type: string
      title: CriminalHistoryChargeSentencesItem
    type__IndustryClassificationCategoriesItem:
      type: object
      properties:
        classification_system:
          $ref: '#/components/schemas/type__IndustryClassificationCategoriesItemClassificationSystem'
        name:
          type: string
          description: Industry name
        sector:
          type:
          - string
          - 'null'
          description: Industry sector in CONSTANT_CASE
        category:
          type: string
          description: Industry category in CONSTANT_CASE
        score:
          type: number
          format: double
          description: Classification confidence score (0.0 to 1.0)
        high_risk:
          type: boolean
          description: Whether this industry is considered high risk
        naics_codes:
          type: array
          items:
            type: string
          description: NAICS (2022) classification codes
        sic_codes:
          type: array
          items:
            type: string
          description: SIC classification codes
        mcc_codes:
          type: array
          items:
            type: string
          description: MCC classification codes
        prohibited_labels:
          type:
          - array
          - 'null'
          items:
            type: string
          description: Prohibited classification labels if applicable
      title: IndustryClassificationCategoriesItem
    type__Certification:
      type: object
      properties:
        object:
          $ref: '#/components/schemas/type__CertificationObject'
        id:
          type: string
          format: uuid
        business_id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        entrance_date:
          type:
          - string
          - 'null'
          format: date-time
        exit_date:
          type:
          - string
          - 'null'
          format: date-time
        certification_id:
          type:
          - string
          - 'null'
        name:
          type: string
        key:
          type: string
        certification_type:
          $ref: '#/components/schemas/type__CertificationCertificationType'
        external_sources:
          type: array
          items:
            $ref: '#/components/schemas/type__CertificationExternalSourcesItem'
      required:
      - object
      - name
      - key
      - certification_type
      - external_sources
      title: Certification
    type__AddressDeliverabilityAnalysis:
      type: object
      properties:
        message:
          type: string
        sub_type:
          $ref: '#/components/schemas/type__AddressDeliverabilityAnalysisSubType'
        sub_key:
          $ref: '#/components/schemas/type__AddressDeliverabilityAnalysisSubKey'
      title: AddressDeliverabilityAnalysis
    type__BusinessSubscriptionAvailabilityLien:
      type: string
      enum:
      - subscribable
      - account_unsubscribable
      title: BusinessSubscriptionAvailabilityLien
    type__RequesterType:
      type: string
      enum:
      - account
      - user
      title: RequesterType
    type__BankruptcyCaseUpdatesItem:
      type: object
      properties:
        guid:
          type: string
        pub_date:
          type: string
        description:
          type: string
      title: BankruptcyCaseUpdatesItem
    type__WatchlistResult:
      type: object
      properties:
        object:
          $ref: '#/components/schemas/type__WatchlistResultObject'
        id:
          type: string
          format: uuid
        status:
          type: string
        entity_name:
          type: string
        entity_aliases:
          type: array
          items:
            type: string
        listed_at:
          type:
          - string
          - 'null'
          format: date-time
        agency_information_url:
          type: string
        agency_list_url:
          type: string
        score:
          type:
          - number
          - 'null'
          format: double
        addresses:
          type: array
          items:
            $ref: '#/components/schemas/type__WatchlistResultAddressesItem'
        url:
          type:
          - string
          - 'null'
          format: uri
        list_country:
          type: string
        list_url:
          type:
          - string
          - 'null'
          format: uri
        list_region:
          type: string
        categories:
          type: array
          items:
            type: string
      required:
      - object
      - id
      - status
      - entity_name
      - entity_aliases
      - agency_information_url
      - agency_list_url
      - score
      title: WatchlistResult
    type__AdverseMediaScreeningResultsItemItemsItemFlagsSentimentsItemName:
      type: string
      enum:
      - positive
      - negative
      - neutral
      title: AdverseMediaScreeningResultsItemItemsItemFlagsSentimentsItemName
    type__IndustryClassificationWebsiteStatus:
      type: string
      enum:
      - online
      - offline
      - unknown
      title: IndustryClassificationWebsiteStatus
    type__Address:
      type: object
      properties:
        object:
          type: string
        id:
          type: string
          format: uuid
        address_line1:
          type:
          - string
          - 'null'
        address_line2:
          type:
          - string
          - 'null'
        city:
          type:
          - string
          - 'null'
        state:
          oneOf:
          - $ref: '#/components/schemas/type__AddressState'
          - type: 'null'
        postal_code:
          type:
          - string
          - 'null'
        full_address:
          type: string
        submitted:
          type: boolean
        latitude:
          type:
          - number
          - 'null'
          format: double
        longitude:
          type:
          - number
          - 'null'
          format: double
        property_type:
          oneOf:
          - $ref: '#/components/schemas/type__AddressPropertyType'
          - type: 'null'
        deliverable:
          type: boolean
        deliverability_analysis:
          oneOf:
          - $ref: '#/components/schemas/type__AddressDeliverabilityAnalysis'
          - type: 'null'
        street_view_available:
          type:
          - boolean
          - 'null'
        labels:
          type: array
          items:
            type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        registered_agent_name:
          type:
          - string
          - 'null'
        cmra:
          type: boolean
        business_id:
          type: string
          format: uuid
        location_count:
          type:
          - integer
          - 'null'
        is_registered_agent:
          type:
          - boolean
          - 'null'
        sources:
          type: array
          items:
            $ref: '#/components/schemas/type__Source'
        rating:
          $ref: '#/components/schemas/type__AddressRating'
      required:
      - object
      - id
      - full_address
      - submitted
      - created_at
      - updated_at
      - business_id
      - sources
      - rating
      title: Address
    type__IndustryClassificationStatus:
      type: string
      enum:
      - pending
      - completed
      - failed
      title: IndustryClassificationStatus
    type__PolicyResult:
      type: object
      properties:
        object:
          type: string
        id:
          type: string
          description: Policy result ID
        result:
          type: string
          description: Policy result outcome
        created_at:
          type: string
          description: Creation timestamp
        matched:
          type:
          - string
          - 'null'
          description: Match status
        executed:
          type: boolean
          description: Execution status
        name:
          type:
          - string
          - 'null'
          description: Policy name
        details:
          type: object
          additionalProperties:
            description: Any type
          description: Additional details
        owner_id:
          type: string
          description: Owner ID
        owner_type:
          type: string
          description: Owner type
        business_id:
          type: string
          description: Business ID
        type_of:
          type: string
          description: Type of policy result
        policy_action_results:
          type: array
          items:
            $ref: '#/components/schemas/type__PolicyActionResult'
      title: PolicyResult
    type__Requester:
      type: object
      properties:
        id:
          type: string
          format: uuid
        type:
          $ref: '#/components/schemas/type__RequesterType'
        name:
          type: string
        requested_at:
          type: string
          format: date-time
      required:
      - id
      - type
      - name
      - requested_at
      title: Requester
    type__SubmittedAddressComponent:
      type: object
      properties:
        address_line_1:
          type: string
        address_line_2:
          type: string
        city:
          type: string
        state:
          $ref: '#/components/schemas/type__SubmittedAddressComponentState'
        postal_code:
          type: string
        country:
          type: string
      required:
      - address_line_1
      - city
      - state
      title: SubmittedAddressComponent
    type__AdverseMediaScreeningResultsItemObject:
      type: string
      enum:
      - adverse_media_screening_result
      title: AdverseMediaScreeningResultsItemObject
    type__LienDebtorsItemAddressesItem:
      type: object
      properties:
        full_address:
          type: string
        address_line1:
          type: string
        address_line2:
          type:
          - string
          - 'null'
        city:
          type: string
        state:
          type: string
        postal_code:
          type: string
      title: LienDebtorsItemAddressesItem
    type__IndustryClassificationWebsite:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/type__IndustryClassificationWebsiteStatus'
        parked:
          type: boolean
      title: IndustryClassificationWebsite
    type_businesses_BusinessRequestParamAddressesItem:
      oneOf:
      - $ref: '#/components/schemas/type__SubmittedAddressFull'
      - $ref: '#/components/schemas/type__SubmittedAddressComponent'
      title: BusinessRequestParamAddressesItem
    type__CriminalHistoryChargeDispositionsItem:
      type: object
      properties:
        disposition:
          type:
          - string
          - 'null'
        disposition_date:
          type:
          - string
          - 'null'
          format: date
        disposition_type:
          type:
          - string
          - 'null'
      title: CriminalHistoryChargeDispositionsItem
    type__LienStatusCategory:
      type: string
      enum:
      - active
      - open
      - closed
      - terminated
      - processing
      - unknown
      description: Categorized status of the lien
      title: LienStatusCategory
    type__AddressDeliverabilityAnalysisSubKey:
      type: string
      enum:
      - deliverable
      - undeliverable
      - unknown
      title: AddressDeliverabilityAnalysisSubKey
    type__CriminalHistoryRecordPerson:
      type: object
      properties:
        dob:
          type:
          - string
          - 'null'
          format: date
      title: CriminalHistoryRecordPerson
    type_businesses_BusinessRequestParamOrdersItemSubproductsItem:
      type: string
      enum:
      - articles_of_incorporation
      - certificate_of_good_standing
      - articles_of_incorporation_with_fallback
      - ucc_documents
      - web_analysis
      - industry_classification
      title: BusinessRequestParamOrdersItemSubproductsItem
    type__AdverseMediaScreeningResultsItem:
      type: object
      properties:
        object:
          $ref: '#/components/schemas/type__AdverseMediaScreeningResultsItemObject'
        id:
          type: string
          format: uuid
        risk_scores:
          type: object
          additionalProperties:
            type: number
            format: double
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        match_score:
          type: number
          format: double
        items:
          type: array
          items:
            $ref: '#/components/schemas/type__AdverseMediaScreeningResultsItemItemsItem'
      title: AdverseMediaScreeningResultsItem
    type__PolicyActionResultPolicyAction:
      type: object
      properties:
        id:
          type: string
          description: Policy action ID
        action_type:
          type: string
          description: Type of action
        options:
          type: object
          additionalProperties:
            description: Any type
          description: Action options
        policy_version_id:
          type: string
          description: Policy version ID
      title: PolicyActionResultPolicyAction
    type__FmcsaRegistration:
      type: object
      properties:
        object:
          $ref: '#/components/schemas/type__FmcsaRegistrationObject'
        id:
          type: string
          format: uuid
        dot_number:
          type: string
          description: Department of Transportation (DOT) number
        legal_name:
          type: string
          description: Legal name of the carrier
        dba_name:
          type:
          - string
          - 'null'
          description: Doing Business As name
        source:
          type: string
          format: uri
          description: Source URL for the FMCSA registration data
        addresses:
          type: array
          items:
            type: string
          description: List of carrier addresses
      required:
      - object
      - id
      - dot_number
      - legal_name
      - source
      - addresses
      title: FmcsaRegistration
    type_businesses_BusinessRequestParamOrdersItemProduct:
      type: string
      enum:
      - identity
      - liens
      - adverse_media
      - bankruptcies
      - business_enrichment
      - documents
      - enhanced_screenings
      - kyc
      - litigations
      - people_litigations
      - people_bankruptcies
      - people_tax_liens
      - people_ucc_liens
      - people_criminal_history
      - tin
      - website
      - business_verification_qualify
